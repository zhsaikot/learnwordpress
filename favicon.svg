<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#8b9fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </radialGradient>
    <!-- 3D gradient for main cube faces -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5568d3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sideFace" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5568d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4755a8;stop-opacity:1" />
    </linearGradient>
    <!-- Glossy highlight gradient -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" filter="url(#shadow)">
    <animate attributeName="r" values="30;31;30" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 3D Cube -->
  <g transform="translate(32, 32) scale(0.85) translate(-32, -32)">
    <!-- Top face (lighter) -->
    <polygon points="32,18 50,28 32,38 14,28" fill="url(#topFace)" stroke="#4c4dbf" stroke-width="0.5"/>

    <!-- Left face (medium) -->
    <polygon points="14,28 32,38 32,52 14,42" fill="url(#sideFace)" stroke="#3d4a9c" stroke-width="0.5"/>

    <!-- Right face (darker) -->
    <polygon points="32,38 50,28 50,42 32,52" fill="url(#frontFace)" stroke="#4c4dbf" stroke-width="0.5"/>

    <!-- Glossy overlay on top face -->
    <polygon points="32,18 50,28 32,38 14,28" fill="url(#gloss)" opacity="0.6"/>

    <!-- Highlight edges -->
    <line x1="14" y1="28" x2="32" y2="18" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-linecap="round"/>
    <line x1="32" y1="18" x2="50" y2="28" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- WordPress-style 'W' subtle hint on front face -->
  <path d="M 26 42 L 29 38 L 32 43 L 35 37 L 38 42"
        stroke="rgba(255,255,255,0.4)"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
